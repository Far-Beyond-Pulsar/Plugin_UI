# The `pulsar.ui` plugin's descriptor. A project enables or disables it in
# its Pulsar.toml (`[plugins]`); disabled, its component, passes, editor and
# file types are absent (see crates/core/pulsar_plugins). Its root crate
# carries this file (`pulsar_plugins::installed!`).
id = "pulsar.ui"
name = "UI"
description = "Widgets: the .widget asset and its editor, and the screen-space and world-space widgets a game draws, with their component, script methods, text and pointer interaction"
enabled_by_default = true
provides = [
  { id = "pulsar.ui.api", kind = "api", members = ["helio-ui-api"], version = 1 },
  { id = "pulsar.ui.classes", kind = "class", members = ["WidgetComponent"], version = 1 },
]
# Widget images are bound through the materials' texture table; without the
# materials plugin the passes bind its stand-in and draw everything else.
requires = [
  { id = "pulsar.materials.api", optional = true },
]

# The plugin's root crate (the package in this directory): the one place it
# registers everything it contributes. A game links it without its `editor`
# feature; the editor links it with.
root = "ui_editor_plugin"
