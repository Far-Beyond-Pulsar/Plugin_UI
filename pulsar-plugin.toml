# The `pulsar.ui` plugin's descriptor. A project enables or disables it in
# its Pulsar.toml (`[plugins]`); disabled, its editors and file types are
# absent (see crates/core/pulsar_plugins). Its root crate carries this file
# (`pulsar_plugins::installed!`).
id = "pulsar.ui"
name = "UI"
description = "Widget assets (.widget) and the widget editor"
enabled_by_default = true
requires = []

# The plugin's root crate (the package in this directory): the one place it
# registers everything it contributes. An editor tool: a game never links it.
root = "ui_editor_plugin"
editor_only = true
