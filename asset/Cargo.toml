[package]
name = "widget_asset"
version = "0.1.1"
edition = "2021"
description = "UI (pulsar.ui): the .widget asset, the project's widget library, instance and parameter resolution, layout and drawing commands. No GPUI: the editor and a game both use it."

[lib]
name = "widget_asset"

[dependencies]
engine_fs = { workspace = true }
pulsar_reflection = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
tracing = { workspace = true }

[lints]
workspace = true
